<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Control de Gastos Diarios & Semanales</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- html2pdf.js para exportar reportes en PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans pb-20 min-h-screen select-none">

  <!-- Header Fijo Superior (Mobile App Style) -->
  <header class="bg-gradient-to-r from-brand-600 to-indigo-800 text-white shadow-md sticky top-0 z-30 pt-2 pb-3 px-4">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div>
        <h1 class="font-extrabold text-base leading-tight flex items-center gap-2">
          <i class="fa-solid fa-wallet text-amber-300"></i> Control de Gastos
        </h1>
        <p class="text-[11px] text-indigo-200">Presupuesto Semanal S/ 100</p>
      </div>
      <button onclick="toggleHistoryModal()" class="bg-white/20 hover:bg-white/30 text-white text-xs px-3 py-1.5 rounded-full backdrop-blur-sm transition flex items-center gap-1.5 active:scale-95">
        <i class="fa-solid fa-clock-rotate-left"></i> Historial
      </button>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 pt-4 space-y-4">

    <!-- Tarjeta Principal de Presupuesto Semanal -->
    <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
      <div class="flex justify-between items-start mb-2">
        <div>
          <span class="text-[11px] font-semibold uppercase tracking-wider text-slate-400">Saldo Disponible (Semana)</span>
          <div class="text-3xl font-black text-slate-900 tracking-tight mt-0.5" id="weekly-remaining">S/ 100.00</div>
        </div>
        <span id="budget-badge" class="bg-emerald-100 text-emerald-800 text-[10px] font-extrabold px-2.5 py-1 rounded-full uppercase tracking-wider">
          OK
        </span>
      </div>

      <!-- Barra de Progreso -->
      <div class="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden mb-3">
        <div id="weekly-progress-bar" class="bg-brand-600 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
      </div>

      <div class="grid grid-cols-2 gap-2 pt-2 border-t border-slate-100 text-xs">
        <div class="bg-slate-50 p-2.5 rounded-xl">
          <span class="text-slate-400 block text-[10px] font-semibold uppercase">Gastado:</span>
          <span class="font-bold text-slate-700 text-sm" id="weekly-spent">S/ 0.00</span>
        </div>
        <div class="bg-slate-50 p-2.5 rounded-xl">
          <span class="text-slate-400 block text-[10px] font-semibold uppercase">Recibido:</span>
          <span class="font-bold text-emerald-600 text-sm" id="weekly-income">S/ 100.00</span>
        </div>
      </div>

      <!-- Acciones Rápidas -->
      <div class="mt-3 pt-3 border-t border-slate-100 flex flex-col gap-2">
        <div class="grid grid-cols-2 gap-2">
          <button onclick="shareWhatsApp()" class="bg-emerald-600 active:bg-emerald-700 text-white font-bold text-xs py-2.5 px-3 rounded-xl flex items-center justify-center gap-2 shadow-sm">
            <i class="fa-brands fa-whatsapp text-sm"></i> WhatsApp
          </button>
          <button onclick="downloadPDF()" class="bg-red-600 active:bg-red-700 text-white font-bold text-xs py-2.5 px-3 rounded-xl flex items-center justify-center gap-2 shadow-sm">
            <i class="fa-solid fa-file-pdf text-sm"></i> Generar PDF
          </button>
        </div>
        
        <button onclick="rechargeWeek()" class="w-full bg-slate-800 active:bg-slate-900 text-white font-medium text-xs py-2 px-3 rounded-xl flex items-center justify-center gap-2">
          <i class="fa-solid fa-arrows-rotate text-amber-400"></i> Reiniciar Semana (+ S/ 100 y Archivar)
        </button>
      </div>
    </section>

    <!-- Formulario Móvil de Gastos -->
    <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
      <h2 class="text-xs font-bold text-slate-800 uppercase tracking-wider mb-3 flex items-center gap-1.5">
        <i class="fa-solid fa-circle-plus text-brand-600"></i> Registrar Gasto del Día
      </h2>

      <form id="expense-form" onsubmit="addExpense(event)" class="space-y-3">
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-[10px] font-bold text-slate-400 uppercase mb-1 block">Fecha</label>
            <input type="date" id="expense-date" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-medium focus:ring-2 focus:ring-brand-500 outline-none">
          </div>
          <div>
            <label class="text-[10px] font-bold text-slate-400 uppercase mb-1 block">Categoría</label>
            <select id="expense-category" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-medium focus:ring-2 focus:ring-brand-500 outline-none">
              <option value="Desayuno">🍳 Desayuno</option>
              <option value="Almuerzo">🍲 Almuerzo</option>
              <option value="Cena">🍕 Cena</option>
              <option value="Taxi / Pasajes">🚕 Taxi / Pasajes</option>
              <option value="Bebidas / Antojos">🥤 Bebidas / Antojos</option>
              <option value="Otros">🛒 Otros Gastos</option>
            </select>
          </div>
        </div>

        <div>
          <label class="text-[10px] font-bold text-slate-400 uppercase mb-1 block">Monto Exacto (S/)</label>
          <input type="number" id="expense-amount" step="0.10" min="0.10" placeholder="Ej: 2, 2.50, 10.50" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-base font-extrabold text-slate-900 focus:ring-2 focus:ring-brand-500 outline-none">
        </div>

        <!-- Botones de Acceso Rápido de Montos -->
        <div class="flex gap-1.5 flex-wrap">
          <button type="button" onclick="setQuickAmount(2.00)" class="bg-slate-100 active:bg-slate-200 text-slate-700 text-xs font-bold px-2.5 py-1.5 rounded-lg">S/ 2.00</button>
          <button type="button" onclick="setQuickAmount(2.50)" class="bg-slate-100 active:bg-slate-200 text-slate-700 text-xs font-bold px-2.5 py-1.5 rounded-lg">S/ 2.50</button>
          <button type="button" onclick="setQuickAmount(5.00)" class="bg-slate-100 active:bg-slate-200 text-slate-700 text-xs font-bold px-2.5 py-1.5 rounded-lg">S/ 5.00</button>
          <button type="button" onclick="setQuickAmount(8.00)" class="bg-slate-100 active:bg-slate-200 text-slate-700 text-xs font-bold px-2.5 py-1.5 rounded-lg">S/ 8.00</button>
          <button type="button" onclick="setQuickAmount(10.00)" class="bg-slate-100 active:bg-slate-200 text-slate-700 text-xs font-bold px-2.5 py-1.5 rounded-lg">S/ 10.00</button>
          <button type="button" onclick="setQuickAmount(10.50)" class="bg-slate-100 active:bg-slate-200 text-slate-700 text-xs font-bold px-2.5 py-1.5 rounded-lg">S/ 10.50</button>
        </div>

        <div>
          <label class="text-[10px] font-bold text-slate-400 uppercase mb-1 block">Detalle o Nota (Opcional)</label>
          <input type="text" id="expense-note" placeholder="Ej: Pan con palta, agua, taxi..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs focus:ring-2 focus:ring-brand-500 outline-none">
        </div>

        <button type="submit" class="w-full bg-brand-600 active:bg-brand-700 text-white font-extrabold py-3 rounded-xl text-xs transition shadow-md shadow-brand-500/20 uppercase tracking-wider">
          + Agregar Gasto
        </button>
      </form>
    </section>

    <!-- Lista Desglosada por Días -->
    <section class="space-y-3">
      <div class="flex justify-between items-center px-1">
        <h2 class="text-xs font-bold text-slate-800 uppercase tracking-wider flex items-center gap-1.5">
          <i class="fa-solid fa-list-check text-brand-600"></i> Historial de la Semana
        </h2>
        <span class="text-[11px] text-slate-400 font-medium" id="total-days-count">0 días</span>
      </div>

      <div id="daily-expenses-list" class="space-y-3"></div>
    </section>

  </main>

  <!-- Modal Historial de Semanas Pasadas -->
  <div id="history-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl max-h-[80vh] flex flex-col shadow-2xl overflow-hidden">
      <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
        <div>
          <h3 class="font-bold text-slate-800 text-sm">Semanas Guardadas</h3>
          <p class="text-[11px] text-slate-400">Historial permanente sin borrar</p>
        </div>
        <button onclick="toggleHistoryModal()" class="text-slate-400 hover:text-slate-600 p-2">
          <i class="fa-solid fa-xmark text-base"></i>
        </button>
      </div>

      <div id="history-list" class="p-4 overflow-y-auto space-y-3 flex-1"></div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'gastos_app_data_v3';
    
    let appData = {
      currentCycle: {
        id: Date.now(),
        startDate: new Date().toISOString().split('T')[0],
        income: 100.00,
        expenses: []
      },
      archivedCycles: []
    };

    document.addEventListener('DOMContentLoaded', () => {
      loadData();
      document.getElementById('expense-date').value = new Date().toISOString().split('T')[0];
      renderApp();
    });

    function loadData() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try { appData = JSON.parse(saved); } catch (e) { console.error(e); }
      }
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
    }

    function setQuickAmount(val) {
      document.getElementById('expense-amount').value = val.toFixed(2);
    }

    function addExpense(e) {
      e.preventDefault();
      const date = document.getElementById('expense-date').value;
      const category = document.getElementById('expense-category').value;
      const amount = parseFloat(document.getElementById('expense-amount').value);
      const note = document.getElementById('expense-note').value.trim();

      if (!date || isNaN(amount) || amount <= 0) return;

      const newExpense = { id: Date.now(), date, category, amount, note };
      appData.currentCycle.expenses.push(newExpense);
      saveData();
      renderApp();

      document.getElementById('expense-amount').value = '';
      document.getElementById('expense-note').value = '';
    }

    function deleteExpense(id) {
      appData.currentCycle.expenses = appData.currentCycle.expenses.filter(x => x.id !== id);
      saveData();
      renderApp();
    }

    function rechargeWeek() {
      if (appData.currentCycle.expenses.length === 0) {
        alert('Aún no has registrado gastos en esta semana.');
        return;
      }

      if (confirm('¿Deseas guardar el historial de esta semana e iniciar un nuevo presupuesto de S/ 100?')) {
        appData.archivedCycles.unshift({ ...appData.currentCycle, endDate: new Date().toISOString().split('T')[0] });
        appData.currentCycle = {
          id: Date.now(),
          startDate: new Date().toISOString().split('T')[0],
          income: 100.00,
          expenses: []
        };
        saveData();
        renderApp();
        alert('¡Semana archivada con éxito! Has iniciado una nueva semana con S/ 100.00.');
      }
    }

    function renderApp() {
      const expenses = appData.currentCycle.expenses;
      const totalSpent = expenses.reduce((acc, curr) => acc + curr.amount, 0);
      const remaining = appData.currentCycle.income - totalSpent;
      const percent = Math.min(100, (totalSpent / appData.currentCycle.income) * 100);

      document.getElementById('weekly-spent').textContent = `S/ ${totalSpent.toFixed(2)}`;
      document.getElementById('weekly-remaining').textContent = `S/ ${remaining.toFixed(2)}`;
      document.getElementById('weekly-progress-bar').style.width = `${percent}%`;

      const badge = document.getElementById('budget-badge');
      if (remaining < 0) {
        badge.textContent = 'Excedido';
        badge.className = 'bg-red-100 text-red-800 text-[10px] font-extrabold px-2.5 py-1 rounded-full uppercase';
      } else {
        badge.textContent = 'OK';
        badge.className = 'bg-emerald-100 text-emerald-800 text-[10px] font-extrabold px-2.5 py-1 rounded-full uppercase';
      }

      const grouped = {};
      expenses.forEach(exp => {
        if (!grouped[exp.date]) grouped[exp.date] = [];
        grouped[exp.date].push(exp);
      });

      const sortedDates = Object.keys(grouped).sort((a, b) => new Date(b) - new Date(a));
      document.getElementById('total-days-count').textContent = `${sortedDates.length} día(s)`;

      const container = document.getElementById('daily-expenses-list');
      if (sortedDates.length === 0) {
        container.innerHTML = `
          <div class="bg-white p-6 rounded-2xl text-center text-slate-400 text-xs border border-slate-100">
            No hay gastos registrados en esta semana.
          </div>
        `;
        return;
      }

      container.innerHTML = sortedDates.map(dateStr => {
        const dayName = getDayName(dateStr);
        const dayTotal = grouped[dateStr].reduce((a, c) => a + c.amount, 0);

        const itemsHtml = grouped[dateStr].map(item => `
          <div class="flex justify-between items-center py-2 border-b border-slate-50 last:border-none text-xs">
            <div>
              <span class="font-semibold text-slate-800">${item.category}</span>
              ${item.note ? `<p class="text-[10px] text-slate-400">${item.note}</p>` : ''}
            </div>
            <div class="flex items-center gap-2">
              <span class="font-bold text-slate-900">S/ ${item.amount.toFixed(2)}</span>
              <button onclick="deleteExpense(${item.id})" class="text-slate-300 hover:text-red-500 p-1">
                <i class="fa-solid fa-trash text-[11px]"></i>
              </button>
            </div>
          </div>
        `).join('');

        return `
          <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
            <div class="flex justify-between items-center mb-2 pb-2 border-b border-slate-100">
              <span class="font-bold text-xs text-brand-700 uppercase">${dayName} ${formatShortDate(dateStr)}</span>
              <span class="text-xs font-extrabold bg-slate-100 text-slate-800 px-2 py-0.5 rounded-md">Total: S/ ${dayTotal.toFixed(2)}</span>
            </div>
            ${itemsHtml}
          </div>
        `;
      }).join('');
    }

    function getDayName(dateString) {
      const days = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
      const date = new Date(dateString + 'T00:00:00');
      return days[date.getDay()];
    }

    function formatShortDate(dateString) {
      const [y, m, d] = dateString.split('-');
      return `${d}/${m}`;
    }

    function generateReportText(cycle) {
      const expenses = cycle.expenses;
      const totalSpent = expenses.reduce((acc, curr) => acc + curr.amount, 0);
      const remaining = cycle.income - totalSpent;

      const grouped = {};
      expenses.forEach(exp => {
        if (!grouped[exp.date]) grouped[exp.date] = [];
        grouped[exp.date].push(exp);
      });

      let text = `📋 *REPORTE DE GASTOS SEMANALES*\n-----------------------------------\n`;

      Object.keys(grouped).sort().forEach(dateStr => {
        const dayName = getDayName(dateStr);
        const dayTotal = grouped[dateStr].reduce((a, c) => a + c.amount, 0);
        text += `\n📅 *${dayName.toUpperCase()} ${formatShortDate(dateStr)}*\n`;
        grouped[dateStr].forEach(item => {
          text += ` • ${item.category}: S/ ${item.amount.toFixed(2)}${item.note ? ` (${item.note})` : ''}\n`;
        });
        text += ` 💰 *Subtotal día:* S/ ${dayTotal.toFixed(2)}\n`;
      });

      text += `\n-----------------------------------\n`;
      text += `💵 *Presupuesto Recibido:* S/ ${cycle.income.toFixed(2)}\n`;
      text += `📊 *Total Gastado:* S/ ${totalSpent.toFixed(2)}\n`;
      text += `📉 *Saldo Restante:* S/ ${remaining.toFixed(2)}\n`;

      return text;
    }

    function shareWhatsApp() {
      const text = generateReportText(appData.currentCycle);
      window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
    }

    function downloadPDF() {
      const cycle = appData.currentCycle;
      const expenses = cycle.expenses;
      const totalSpent = expenses.reduce((acc, curr) => acc + curr.amount, 0);
      const remaining = cycle.income - totalSpent;

      const element = document.createElement('div');
      element.className = 'p-6 font-sans text-slate-800 bg-white';
      element.innerHTML = `
        <h1 style="font-size: 20px; font-weight: bold; color: #4338ca; text-align: center; margin-bottom: 5px;">Reporte Semanal de Gastos</h1>
        <p style="font-size: 12px; color: #64748b; text-align: center; margin-bottom: 20px;">Generado el ${new Date().toLocaleDateString('es-PE')}</p>

        <div style="display: flex; justify-content: space-between; background-color: #f8fafc; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 12px;">
          <div><strong>Presupuesto:</strong> S/ ${cycle.income.toFixed(2)}</div>
          <div><strong>Total Gastado:</strong> S/ ${totalSpent.toFixed(2)}</div>
          <div><strong>Saldo Restante:</strong> S/ ${remaining.toFixed(2)}</div>
        </div>

        ${Object.keys(expenses.reduce((a, c) => { (a[c.date] = a[c.date] || []).push(c); return a; }, {})).map(dateStr => `
          <div style="margin-bottom: 15px;">
            <h3 style="font-size: 13px; font-weight: bold; color: #1e293b; border-bottom: 1px solid #e2e8f0; padding-bottom: 4px;">
              ${getDayName(dateStr)}${formatShortDate(dateStr)}
            </h3>
            <ul style="font-size: 11px; padding-left: 15px; margin-top: 5px;">
              ${expenses.filter(x => x.date === dateStr).map(x => `
                <li style="margin-bottom: 3px;">
                  <strong>${x.category}:</strong> S/ ${x.amount.toFixed(2)} ${x.note ? `<em>(${x.note})</em>` : ''}
                </li>
              `).join('')}
            </ul>
          </div>
        `).join('')}
      `;

      const opt = {
        margin:       10,
        filename:     `Reporte_Gastos_${new Date().toISOString().split('T')[0]}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(element).save();
    }

    function toggleHistoryModal() {
      const modal = document.getElementById('history-modal');
      modal.classList.toggle('hidden');

      if (!modal.classList.contains('hidden')) {
        const container = document.getElementById('history-lis
