<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Control Privado de Gastos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    body {
      background-color: #0b1329;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    .card {
      background-color: #111c38;
      border: 1px solid #1e2d54;
    }
    .btn-green {
      background-color: #059669;
      color: white;
    }
    .btn-green:active {
      background-color: #047857;
    }
    .btn-quick {
      background-color: #162447;
      border: 1px solid #223668;
    }
    .btn-quick:active {
      background-color: #1f3363;
    }
    .tab-active {
      background-color: #059669 !important;
      color: white !important;
    }
  </style>
</head>
<body class="pb-12">

  <!-- ENCABEZADO -->
  <header class="p-4 bg-[#0d1730] border-b border-[#1e2d54] sticky top-0 z-50 shadow-md">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-emerald-600 flex items-center justify-center text-white font-bold text-lg shadow">
          S/
        </div>
        <div>
          <h1 class="font-bold text-base text-white leading-tight">Mi Control Privado</h1>
          <p id="header-date" class="text-xs text-emerald-400 font-medium">Cargando fecha...</p>
        </div>
      </div>
      <button onclick="resetCycle()" class="text-xs bg-emerald-950 text-emerald-300 border border-emerald-700 px-3 py-1.5 rounded-lg font-semibold active:scale-95 transition">
        + S/ 100
      </button>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- TARJETA PRESUPUESTO CICLO 6 DÍAS -->
    <div class="card p-4 rounded-2xl shadow-lg space-y-3">
      <div class="flex justify-between items-end">
        <div>
          <span class="text-xs text-gray-400 block font-medium">Disponible (Ciclo 6 días)</span>
          <span id="disp-val" class="text-3xl font-extrabold text-emerald-400">S/ 100.00</span>
        </div>
        <div class="text-right">
          <span class="text-xs text-gray-400 block font-medium">Gastado</span>
          <span id="gast-val" class="text-base font-bold text-gray-200">S/ 0.00</span>
        </div>
      </div>

      <!-- Barra de Progreso -->
      <div class="w-full bg-gray-800 rounded-full h-3 overflow-hidden p-0.5 border border-gray-700">
        <div id="progress-bar" class="bg-emerald-500 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
      </div>

      <!-- Botones de Acción / Exportación -->
      <div class="grid grid-cols-2 gap-2 pt-1">
        <button onclick="sendWhatsApp()" class="flex items-center justify-center gap-2 bg-emerald-700 text-white text-xs py-2 px-3 rounded-xl font-semibold active:scale-95 transition">
          📲 Enviar WhatsApp
        </button>
        <button onclick="exportPDF()" class="flex items-center justify-center gap-2 bg-slate-700 text-white text-xs py-2 px-3 rounded-xl font-semibold active:scale-95 transition">
          📄 PDF Ciclo
        </button>
      </div>
    </div>

    <!-- PESTAÑAS DE NAVEGACIÓN -->
    <div class="grid grid-cols-3 gap-1 bg-[#0d1730] p-1 rounded-xl border border-[#1e2d54]">
      <button id="tab-hoy" onclick="switchTab('hoy')" class="py-2 text-xs font-bold rounded-lg text-gray-400 tab-active transition">
        Hoy
      </button>
      <button id="tab-historial" onclick="switchTab('historial')" class="py-2 text-xs font-bold rounded-lg text-gray-400 transition">
        Historial Días
      </button>
      <button id="tab-mes" onclick="switchTab('mes')" class="py-2 text-xs font-bold rounded-lg text-gray-400 transition">
        Resumen Mes
      </button>
    </div>

    <!-- VISTA 1: HOY (ENTRADA RÁPIDA Y MANUAL) -->
    <div id="view-hoy" class="space-y-4">
      <!-- Botones Rápidos -->
      <div class="card p-4 rounded-2xl">
        <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Botones Rápidos</h2>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="addQuick('Desayuno', 3)" class="btn-quick p-3 rounded-xl text-left flex justify-between items-center">
            <div>
              <span class="block text-xs text-gray-400">☕ Desayuno</span>
              <span class="font-bold text-sm text-emerald-400">S/ 3.00</span>
            </div>
            <span class="text-lg text-emerald-500 font-bold">+</span>
          </button>

          <button onclick="addQuick('Almuerzo', 10)" class="btn-quick p-3 rounded-xl text-left flex justify-between items-center">
            <div>
              <span class="block text-xs text-gray-400">🍲 Almuerzo</span>
              <span class="font-bold text-sm text-emerald-400">S/ 10.00</span>
            </div>
            <span class="text-lg text-emerald-500 font-bold">+</span>
          </button>

          <button onclick="addQuick('Cena', 10)" class="btn-quick p-3 rounded-xl text-left flex justify-between items-center">
            <div>
              <span class="block text-xs text-gray-400">🌙 Cena</span>
              <span class="font-bold text-sm text-emerald-400">S/ 10.00</span>
            </div>
            <span class="text-lg text-emerald-500 font-bold">+</span>
          </button>

          <button onclick="addQuick('Pasaje', 2)" class="btn-quick p-3 rounded-xl text-left flex justify-between items-center">
            <div>
              <span class="block text-xs text-gray-400">🚌 Pasaje</span>
              <span class="font-bold text-sm text-emerald-400">S/ 2.00</span>
            </div>
            <span class="text-lg text-emerald-500 font-bold">+</span>
          </button>
        </div>
      </div>

      <!-- Formulario Manual -->
      <div class="card p-4 rounded-2xl space-y-3">
        <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Registrar Otro Gasto</h2>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs text-gray-400 block mb-1">Fecha</label>
            <input type="date" id="input-date" class="w-full bg-[#162447] border border-[#223668] rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="text-xs text-gray-400 block mb-1">Categoría</label>
            <select id="input-cat" class="w-full bg-[#162447] border border-[#223668] rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-emerald-500">
              <option value="Alimentación">🍲 Alimentación</option>
              <option value="Pasaje">🚌 Pasaje</option>
              <option value="Varios">🛒 Varios</option>
            </select>
          </div>
        </div>

        <div>
          <label class="text-xs text-gray-400 block mb-1">Concepto / Detalle</label>
          <input type="text" id="input-desc" placeholder="Ej: Menú 10 soles, taxi..." class="w-full bg-[#162447] border border-[#223668] rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-emerald-500">
        </div>

        <div>
          <label class="text-xs text-gray-400 block mb-1">Monto (S/)</label>
          <input type="number" step="0.5" id="input-amount" placeholder="0.00" class="w-full bg-[#162447] border border-[#223668] rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-emerald-500">
        </div>

        <button onclick="addManual()" class="w-full btn-green py-3 rounded-xl font-bold text-xs uppercase tracking-wider shadow active:scale-98 transition">
          Guardar Gasto
        </button>
      </div>

      <!-- Lista de Gastos de Hoy -->
      <div class="card p-4 rounded-2xl space-y-3">
        <div class="flex justify-between items-center">
          <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Gastos Registrados Hoy</h2>
          <span id="today-total" class="text-xs font-bold text-emerald-400">Total: S/ 0.00</span>
        </div>
        <div id="today-list" class="space-y-2">
          <!-- Ítems agregados dinámicamente -->
        </div>
      </div>
    </div>

    <!-- VISTA 2: HISTORIAL COMPLETO DÍA POR DÍA -->
    <div id="view-historial" class="hidden space-y-4">
      <div class="flex justify-between items-center px-1">
        <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Historial Organizado por Fechas</h2>
        <button onclick="exportPDF()" class="text-xs text-emerald-400 underline font-semibold">Descargar PDF</button>
      </div>
      <div id="history-container" class="space-y-3">
        <!-- Bloques agrupados por día -->
      </div>
    </div>

    <!-- VISTA 3: RESUMEN MENSUAL -->
    <div id="view-mes" class="hidden space-y-4">
      <div class="card p-4 rounded-2xl space-y-3">
        <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Resumen Total del Mes</h2>
        <div class="flex justify-between items-center pt-1 border-b border-gray-800 pb-3">
          <span class="text-sm text-gray-300">Gasto Total Acumulado:</span>
          <span id="month-total" class="text-xl font-black text-emerald-400">S/ 0.00</span>
        </div>
        <button onclick="exportPDF()" class="w-full bg-slate-700 text-white text-xs py-2.5 rounded-xl font-semibold active:scale-95 transition">
          📄 Descargar Reporte Completo PDF
        </button>
      </div>
    </div>

  </main>

  <script>
    // ESTADO DE LA APLICACIÓN
    let state = {
      budget: 100,
      expenses: []
    };

    // INICIALIZACIÓN SEGURA
    window.onload = function() {
      loadLocalStorage();
      setTodayDate();
      renderAll();
    };

    function setTodayDate() {
      const now = new Date();
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      const dateStr = now.toLocaleDateString('es-PE', options);
      document.getElementById('header-date').innerText = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);

      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      document.getElementById('input-date').value = `${yyyy}-${mm}-${dd}`;
    }

    function loadLocalStorage() {
      try {
        const saved = localStorage.getItem('control_gastos_data_v2');
        if (saved) {
          state = JSON.parse(saved);
        }
      } catch (e) {
        console.error("Error al cargar localStorage", e);
      }
    }

    function saveLocalStorage() {
      try {
        localStorage.setItem('control_gastos_data_v2', JSON.stringify(state));
      } catch (e) {
        console.error("Error al guardar localStorage", e);
      }
    }

    // CAMBIO DE PESTAÑAS
    function switchTab(tab) {
      document.getElementById('view-hoy').classList.add('hidden');
      document.getElementById('view-historial').classList.add('hidden');
      document.getElementById('view-mes').classList.add('hidden');

      document.getElementById('tab-hoy').classList.remove('tab-active');
      document.getElementById('tab-historial').classList.remove('tab-active');
      document.getElementById('tab-mes').classList.remove('tab-active');

      if (tab === 'hoy') {
        document.getElementById('view-hoy').classList.remove('hidden');
        document.getElementById('tab-hoy').classList.add('tab-active');
      } else if (tab === 'historial') {
        document.getElementById('view-historial').classList.remove('hidden');
        document.getElementById('tab-historial').classList.add('tab-active');
      } else if (tab === 'mes') {
        document.getElementById('view-mes').classList.remove('hidden');
        document.getElementById('tab-mes').classList.add('tab-active');
      }
    }

    // REGISTRO DE GASTOS
    function addQuick(desc, amount) {
      const dateVal = document.getElementById('input-date').value || new Date().toISOString().split('T')[0];
      const newExp = {
        id: Date.now(),
        date: dateVal,
        concept: desc,
        category: 'Alimentación',
        amount: parseFloat(amount)
      };
      state.expenses.push(newExp);
      saveLocalStorage();
      renderAll();
    }

    function addManual() {
      const dateVal = document.getElementById('input-date').value;
      const catVal = document.getElementById('input-cat').value;
      const descVal = document.getElementById('input-desc').value.trim();
      const amountVal = parseFloat(document.getElementById('input-amount').value);

      if (!dateVal || isNaN(amountVal) || amountVal <= 0) {
        alert("Por favor ingresa un monto válido mayor a 0.");
        return;
      }

      const newExp = {
        id: Date.now(),
        date: dateVal,
        concept: descVal || catVal,
        category: catVal,
        amount: amountVal
      };

      state.expenses.push(newExp);
      saveLocalStorage();
      renderAll();

      document.getElementById('input-desc').value = '';
      document.getElementById('input-amount').value = '';
    }

    // ELIMINAR GASTO EN 1 TOQUE
    function deleteExpense(id) {
      state.expenses = state.expenses.filter(item => item.id !== id);
      saveLocalStorage();
      renderAll();
    }

    function resetCycle() {
      if (confirm("¿Deseas iniciar un nuevo ciclo de S/ 100? El historial de días anteriores se mantendrá guardado.")) {
        state.budget = 100;
        saveLocalStorage();
        renderAll();
      }
    }

    // RENDERIZADO PRINCIPAL
    function renderAll() {
      const totalSpent = state.expenses.reduce((acc, curr) => acc + curr.amount, 0);
      const disp = state.budget - totalSpent;
      const pct = Math.min(Math.max((totalSpent / state.budget) * 100, 0), 100);

      document.getElementById('gast-val').innerText = `S/ ${totalSpent.toFixed(2)}`;
      document.getElementById('disp-val').innerText = `S/ ${disp.toFixed(2)}`;
      document.getElementById('progress-bar').style.width = `${pct}%`;
      document.getElementById('month-total').innerText = `S/ ${totalSpent.toFixed(2)}`;

      renderTodayList();
      renderHistory();
    }

    function renderTodayList() {
      const todayStr = document.getElementById('input-date').value || new Date().toISOString().split('T')[0];
      const todayList = document.getElementById('today-list');
      todayList.innerHTML = '';

      const items = state.expenses.filter(x => x.date === todayStr);
      let daySum = 0;

      if (items.length === 0) {
        todayList.innerHTML = `<p class="text-xs text-gray-500 italic py-2 text-center">No hay gastos registrados hoy.</p>`;
      } else {
        items.forEach(item => {
          daySum += item.amount;
          const el = document.createElement('div');
          el.className = 'flex justify-between items-center bg-[#162447] p-2.5 rounded-xl border border-[#223668]';
          el.innerHTML = `
            <div>
              <span class="block text-xs font-semibold text-gray-200">${item.concept}</span>
              <span class="text-[10px] text-gray-400">${item.category}</span>
            </div>
            <div class="flex items-center gap-3">
              <span class="font-bold text-xs text-emerald-400">S/ ${item.amount.toFixed(2)}</span>
              <button onclick="deleteExpense(${item.id})" class="text-red-400 hover:text-red-300 font-bold p-1 text-sm active:scale-90 transition" title="Eliminar">🗑️</button>
            </div>
          `;
          todayList.appendChild(el);
        });
      }

      document.getElementById('today-total').innerText = `Total Hoy: S/ ${daySum.toFixed(2)}`;
    }

    function renderHistory() {
      const container = document.getElementById('history-container');
      container.innerHTML = '';

      if (state.expenses.length === 0) {
        container.innerHTML = `<p class="text-xs text-gray-500 italic py-4 text-center">Sin historial aún.</p>`;
        return;
      }

      // Agrupar por fecha
      const groups = {};
      state.expenses.forEach(item => {
        if (!groups[item.date]) groups[item.date] = [];
        groups[item.date].push(item);
      });

      // Ordenar fechas descendente
      const sortedDates = Object.keys(groups).sort().reverse();

      sortedDates.forEach(dateStr => {
        const items = groups[dateStr];
        const dayTotal = items.reduce((a, c) => a + c.amount, 0);

        const card = document.createElement('div');
        card.className = 'card p-3 rounded-2xl space-y-2';

        let itemsHtml = items.map(item => `
          <div class="flex justify-between items-center py-1 border-b border-gray-800/50 last:border-0">
            <span class="text-xs text-gray-300">${item.concept}</span>
            <div class="flex items-center gap-2">
              <span class="text-xs font-semibold text-gray-200">S/ ${item.amount.toFixed(2)}</span>
              <button onclick="deleteExpense(${item.id})" class="text-red-400 p-0.5 text-xs">🗑️</button>
            </div>
          </div>
        `).join('');

        card.innerHTML = `
          <div class="flex justify-between items-center border-b border-gray-700 pb-1.5">
            <span class="text-xs font-bold text-emerald-400">${dateStr}</span>
            <span class="text-xs font-bold text-white">Total Día: S/ ${dayTotal.toFixed(2)}</span>
          </div>
          <div class="space-y-1">
            ${itemsHtml}
          </div>
        `;

        container.appendChild(card);
      });
    }

    // ENVIAR POR WHATSAPP
    function sendWhatsApp() {
      if (state.expenses.length === 0) {
        alert("No hay gastos registrados para compartir.");
        return;
      }

      let msg = `*📊 RESUMEN DE GASTOS PRIVADO*\n`;
      msg += ` Presupuesto: S/ ${state.budget.toFixed(2)}\n\n`;

      const groups = {};
      state.expenses.forEach(item => {
        if (!groups[item.date]) groups[item.date] = [];
        groups[item.date].push(item);
      });

      let grandTotal = 0;
      Object.keys(groups).sort().forEach(dateStr => {
        const items = groups[dateStr];
        const dayTotal = items.reduce((a, c) => a + c.amount, 0);
        grandTotal += dayTotal;

        msg += `📅 *${dateStr}*\n`;
        items.forEach(i => {
          msg += `  • ${i.concept}: S/ ${i.amount.toFixed(2)}\n`;
        });
        msg += `  👉 *Total Día: S/ ${dayTotal.toFixed(2)}*\n\n`;
      });

      msg += `💰 *TOTAL GASTADO: S/ ${grandTotal.toFixed(2)}*\n`;
      msg += `💵 *DISPONIBLE: S/ ${(state.budget - grandTotal).toFixed(2)}*`;

      const encoded = encodeURIComponent(msg);
      window.open(`https://api.whatsapp.com/send?text=${encoded}`, '_blank');
    }

    // EXPORTAR A PDF
    function exportPDF() {
      const element = document.createElement('div');
      element.style.padding = '20px';
      element.style.color = '#000';
      element.style.backgroundColor = '#fff';

      let html = `<h1 style="font-size:18px; font-weight:bold;">Reporte de Gastos Diarios</h1>`;
      html += `<p style="font-size:12px;">Presupuesto Ciclo: S/ ${state.budget.toFixed(2)}</p><hr><br>`;

      const groups = {};
      state.expenses.forEach(item => {
        if (!groups[item.date]) groups[item.date] = [];
        groups[item.date].push(item);
      });

      let grandTotal = 0;
      Object.keys(groups).sort().forEach(dateStr => {
        const items = groups[dateStr];
        const dayTotal = items.reduce((a, c) => a + c.amount, 0);
        grandTotal += dayTotal;

        html += `<h3 style="font-size:14px; margin-bottom:5px;">📅 Fecha: ${dateStr}</h3><ul>`;
        items.forEach(i => {
          html += `<li>${i.concept} (${i.category}): S/ ${i.amount.toFixed(2)}</li>`;
        });
        html += `</ul><p><strong>Subtotal Día: S/
